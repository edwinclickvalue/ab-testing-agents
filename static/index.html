<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent UX Tester</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f0f;
      color: #e8e8e8;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 48px 16px;
    }

    .container {
      width: 100%;
      max-width: 680px;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 32px;
    }

    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 24px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 500;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }

    input[type="url"],
    input[type="text"],
    textarea {
      width: 100%;
      background: #111;
      border: 1px solid #333;
      border-radius: 6px;
      color: #e8e8e8;
      font-size: 0.9rem;
      font-family: inherit;
      padding: 10px 12px;
      outline: none;
      transition: border-color 0.15s;
      margin-bottom: 16px;
    }

    input[type="url"]:focus,
    input[type="text"]:focus,
    textarea:focus {
      border-color: #555;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    input::placeholder,
    textarea::placeholder {
      color: #444;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    button:hover:not(:disabled) { opacity: 0.85; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .spinner {
      display: none;
      align-items: center;
      gap: 10px;
      color: #666;
      font-size: 0.85rem;
      margin-top: 16px;
    }

    .spinner.active { display: flex; }

    .spinner-dot {
      width: 6px;
      height: 6px;
      background: #555;
      border-radius: 50%;
      animation: pulse 1.2s ease-in-out infinite;
    }

    .spinner-dot:nth-child(2) { animation-delay: 0.2s; }
    .spinner-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1); }
    }

    #results { display: none; }

    .result-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .badge.success { background: #0d2818; color: #4ade80; border: 1px solid #166534; }
    .badge.fail    { background: #2d0d0d; color: #f87171; border: 1px solid #991b1b; }

    .meta {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }

    .meta-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .meta-label {
      font-size: 0.7rem;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .meta-value {
      font-size: 1.1rem;
      font-weight: 600;
      color: #e8e8e8;
    }

    .reason {
      font-size: 0.875rem;
      color: #aaa;
      line-height: 1.5;
      margin-bottom: 20px;
      padding: 12px;
      background: #111;
      border-radius: 6px;
      border-left: 2px solid #333;
    }

    .friction-title {
      font-size: 0.75rem;
      font-weight: 500;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    .friction-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .friction-list li {
      font-size: 0.85rem;
      color: #999;
      padding: 8px 12px;
      background: #111;
      border-radius: 6px;
      border-left: 2px solid #f97316;
    }

    .friction-list li::before {
      content: "⚠ ";
      opacity: 0.6;
    }

    .no-friction {
      font-size: 0.85rem;
      color: #555;
      font-style: italic;
    }

    .error-msg {
      color: #f87171;
      font-size: 0.875rem;
      padding: 12px;
      background: #1a0a0a;
      border: 1px solid #3d1515;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Agent UX Tester</h1>
    <p class="subtitle">AI-agent bezoekt website en probeert doel te bereiken</p>

    <div class="card">
      <form id="testForm">
        <label for="url">Website URL</label>
        <input
          type="url"
          id="url"
          placeholder="https://example.com"
          required
        >

        <label for="goal">Opdracht voor de agent</label>
        <textarea
          id="goal"
          placeholder="Zoek een groene schoen en voeg hem toe aan je winkelmandje"
          required
        ></textarea>

        <label for="persona">Persona (optioneel)</label>
        <input
          type="text"
          id="persona"
          placeholder="casual shopper"
          value="casual shopper"
        >

        <button type="submit" id="submitBtn">Test starten</button>

        <div class="spinner" id="spinner">
          <div class="spinner-dot"></div>
          <div class="spinner-dot"></div>
          <div class="spinner-dot"></div>
          <span id="spinnerText">Agent navigeert...</span>
        </div>
      </form>
    </div>

    <div class="card" id="results">
      <div id="resultsContent"></div>
    </div>
  </div>

  <script>
    const form = document.getElementById('testForm');
    const submitBtn = document.getElementById('submitBtn');
    const spinner = document.getElementById('spinner');
    const spinnerText = document.getElementById('spinnerText');
    const results = document.getElementById('results');
    const resultsContent = document.getElementById('resultsContent');

    const spinnerMessages = [
      'Agent navigeert...',
      'Pagina aan het laden...',
      'Elementen zoeken...',
      'Interactie uitvoeren...',
      'Bijna klaar...',
    ];

    let spinnerInterval;

    function startSpinner() {
      let i = 0;
      spinnerText.textContent = spinnerMessages[0];
      spinnerInterval = setInterval(() => {
        i = (i + 1) % spinnerMessages.length;
        spinnerText.textContent = spinnerMessages[i];
      }, 3000);
    }

    function stopSpinner() {
      clearInterval(spinnerInterval);
    }

    function renderResults(data) {
      const frictionHtml = data.friction_points && data.friction_points.length > 0
        ? `<ul class="friction-list">${data.friction_points.map(f => `<li>${f}</li>`).join('')}</ul>`
        : `<p class="no-friction">Geen friction points gevonden</p>`;

      resultsContent.innerHTML = `
        <div class="result-header">
          <span class="badge ${data.success ? 'success' : 'fail'}">
            ${data.success ? '✓ Doel bereikt' : '✗ Mislukt'}
          </span>
        </div>

        <div class="meta">
          <div class="meta-item">
            <span class="meta-label">Stappen</span>
            <span class="meta-value">${data.steps}</span>
          </div>
          <div class="meta-item">
            <span class="meta-label">Tijd</span>
            <span class="meta-value">${data.time_seconds}s</span>
          </div>
        </div>

        <div class="reason">${data.reason}</div>

        <div class="friction-title">Friction points</div>
        ${frictionHtml}
      `;
    }

    function renderError(msg) {
      resultsContent.innerHTML = `<div class="error-msg">Fout: ${msg}</div>`;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const url = document.getElementById('url').value.trim();
      const goal = document.getElementById('goal').value.trim();
      const persona = document.getElementById('persona').value.trim() || 'casual shopper';

      submitBtn.disabled = true;
      spinner.classList.add('active');
      results.style.display = 'none';
      startSpinner();

      try {
        const res = await fetch('/test', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url, goal, persona }),
        });

        const data = await res.json();

        if (!res.ok) {
          renderError(data.detail || 'Onbekende fout');
        } else {
          renderResults(data);
        }
      } catch (err) {
        renderError(err.message);
      } finally {
        stopSpinner();
        spinner.classList.remove('active');
        submitBtn.disabled = false;
        results.style.display = 'block';
      }
    });
  </script>
</body>
</html>
