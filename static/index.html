<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent UX Tester</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f0f;
      color: #e8e8e8;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 48px 16px;
    }

    .container { width: 100%; max-width: 720px; }

    h1 { font-size: 1.25rem; font-weight: 600; color: #fff; margin-bottom: 4px; }
    .subtitle { font-size: 0.85rem; color: #666; margin-bottom: 24px; }

    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 20px;
      border-bottom: 1px solid #222;
      padding-bottom: 0;
    }

    .tab {
      padding: 8px 16px;
      font-size: 0.85rem;
      font-weight: 500;
      color: #666;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color 0.15s, border-color 0.15s;
    }

    .tab.active { color: #fff; border-bottom-color: #fff; }
    .tab:hover:not(.active) { color: #aaa; }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .ab-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    .ab-col-label {
      font-size: 0.7rem;
      font-weight: 600;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 500;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }

    input[type="url"], input[type="text"], textarea {
      width: 100%;
      background: #111;
      border: 1px solid #333;
      border-radius: 6px;
      color: #e8e8e8;
      font-size: 0.9rem;
      font-family: inherit;
      padding: 10px 12px;
      outline: none;
      transition: border-color 0.15s;
      margin-bottom: 16px;
    }

    input[type="url"]:focus, input[type="text"]:focus, textarea:focus { border-color: #555; }
    textarea { resize: vertical; min-height: 80px; }
    input::placeholder, textarea::placeholder { color: #444; }

    .shared-fields { margin-top: 4px; }

    button {
      width: 100%;
      padding: 12px;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    button:hover:not(:disabled) { opacity: 0.85; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .spinner {
      display: none;
      align-items: center;
      gap: 10px;
      color: #666;
      font-size: 0.85rem;
      margin-top: 16px;
    }

    .spinner.active { display: flex; }

    .spinner-dot {
      width: 6px; height: 6px;
      background: #555;
      border-radius: 50%;
      animation: pulse 1.2s ease-in-out infinite;
    }

    .spinner-dot:nth-child(2) { animation-delay: 0.2s; }
    .spinner-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1); }
    }

    .results-hidden { display: none; }

    .result-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .badge.success { background: #0d2818; color: #4ade80; border: 1px solid #166534; }
    .badge.fail    { background: #2d0d0d; color: #f87171; border: 1px solid #991b1b; }
    .badge.winner  { background: #1a1a00; color: #facc15; border: 1px solid #854d0e; }

    .meta { display: flex; gap: 20px; margin-bottom: 20px; }
    .meta-item { display: flex; flex-direction: column; gap: 2px; }
    .meta-label { font-size: 0.7rem; color: #555; text-transform: uppercase; letter-spacing: 0.05em; }
    .meta-value { font-size: 1.1rem; font-weight: 600; color: #e8e8e8; }

    .reason {
      font-size: 0.875rem; color: #aaa; line-height: 1.5;
      margin-bottom: 20px; padding: 12px;
      background: #111; border-radius: 6px; border-left: 2px solid #333;
    }

    .friction-title {
      font-size: 0.75rem; font-weight: 500; color: #666;
      text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px;
    }

    .friction-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
    .friction-list li {
      font-size: 0.85rem; color: #999;
      padding: 8px 12px; background: #111;
      border-radius: 6px; border-left: 2px solid #f97316;
    }
    .friction-list li::before { content: "⚠ "; opacity: 0.6; }
    .no-friction { font-size: 0.85rem; color: #555; font-style: italic; }

    .screenshots-title {
      font-size: 0.75rem; font-weight: 500; color: #666;
      text-transform: uppercase; letter-spacing: 0.05em;
      margin-top: 20px; margin-bottom: 8px;
    }

    .screenshots-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      scrollbar-width: thin;
      scrollbar-color: #333 transparent;
    }

    .screenshot-item {
      flex: 0 0 auto;
      position: relative;
      cursor: pointer;
    }

    .screenshot-item img {
      height: 120px;
      width: auto;
      border-radius: 4px;
      border: 1px solid #2a2a2a;
      display: block;
      transition: border-color 0.15s;
    }

    .screenshot-item:hover img { border-color: #555; }

    .screenshot-step {
      position: absolute;
      top: 4px; left: 4px;
      background: rgba(0,0,0,0.7);
      color: #aaa;
      font-size: 0.65rem;
      font-weight: 600;
      padding: 2px 5px;
      border-radius: 3px;
    }

    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
    }

    .lightbox.active { display: flex; }

    .lightbox img {
      max-width: 88vw;
      max-height: 80vh;
      border-radius: 6px;
    }

    .lightbox-close {
      position: fixed;
      top: 16px; right: 20px;
      color: #888; font-size: 1.5rem;
      cursor: pointer; line-height: 1;
    }

    .lightbox-label { color: #555; font-size: 0.8rem; }

    .lightbox-nav {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .lightbox-arrow {
      background: none;
      border: 1px solid #333;
      color: #aaa;
      width: 40px; height: 40px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.15s, color 0.15s;
      width: auto;
      padding: 8px 16px;
      border-radius: 6px;
    }

    .lightbox-arrow:hover { border-color: #666; color: #fff; }
    .lightbox-arrow:disabled { opacity: 0.2; cursor: default; }

    .ab-results-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .ab-result-card {
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 16px;
    }

    .ab-result-card.is-winner { border-color: #854d0e; }

    .ab-version-label {
      font-size: 0.7rem; font-weight: 700;
      color: #555; text-transform: uppercase;
      letter-spacing: 0.08em; margin-bottom: 12px;
    }

    .winner-banner {
      text-align: center;
      padding: 16px;
      margin-bottom: 20px;
      background: #1a1500;
      border: 1px solid #854d0e;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      color: #facc15;
    }

    .error-msg {
      color: #f87171; font-size: 0.875rem;
      padding: 12px; background: #1a0a0a;
      border: 1px solid #3d1515; border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Agent UX Tester</h1>
    <p class="subtitle">AI-agent bezoekt website en probeert doel te bereiken</p>

    <div class="tabs">
      <div class="tab active" data-tab="single">Enkele test</div>
      <div class="tab" data-tab="ab">A/B test</div>
    </div>

    <!-- SINGLE TEST -->
    <div class="tab-panel active" id="panel-single">
      <div class="card">
        <form id="singleForm">
          <label for="url">Website URL</label>
          <input type="url" id="url" placeholder="https://example.com" value="https://www.clickvalue.nl" required>

          <label for="goal">Opdracht voor de agent</label>
          <textarea id="goal" placeholder="Zoek een groene schoen en voeg hem toe aan je winkelmandje" required>Zoek alle clickvalue vacatures op en filter op alles dat voor ClickValue is (er staan namelijk vacatures van meerdere bedrijven)</textarea>

          <label for="persona">Persona (optioneel)</label>
          <input type="text" id="persona" placeholder="casual shopper" value="casual shopper">

          <button type="submit" id="singleBtn">Test starten</button>

          <div class="spinner" id="singleSpinner">
            <div class="spinner-dot"></div>
            <div class="spinner-dot"></div>
            <div class="spinner-dot"></div>
            <span id="singleSpinnerText">Agent navigeert...</span>
          </div>
        </form>
      </div>

      <div class="card results-hidden" id="singleResults">
        <div id="singleResultsContent"></div>
      </div>
    </div>

    <!-- AB TEST -->
    <div class="tab-panel" id="panel-ab">
      <div class="card">
        <form id="abForm">
          <div class="ab-grid">
            <div>
              <div class="ab-col-label">Versie A</div>
              <label for="url_a">URL</label>
              <input type="url" id="url_a" placeholder="https://versie-a.nl" required>
            </div>
            <div>
              <div class="ab-col-label">Versie B</div>
              <label for="url_b">URL</label>
              <input type="url" id="url_b" placeholder="https://versie-b.nl" required>
            </div>
          </div>

          <div class="shared-fields">
            <label for="ab_goal">Opdracht voor de agent</label>
            <textarea id="ab_goal" placeholder="Zoek een groene schoen en voeg hem toe aan je winkelmandje" required></textarea>

            <label for="ab_persona">Persona (optioneel)</label>
            <input type="text" id="ab_persona" placeholder="casual shopper" value="casual shopper">
          </div>

          <button type="submit" id="abBtn">A/B test starten</button>

          <div class="spinner" id="abSpinner">
            <div class="spinner-dot"></div>
            <div class="spinner-dot"></div>
            <div class="spinner-dot"></div>
            <span id="abSpinnerText">Beide versies testen...</span>
          </div>
        </form>
      </div>

      <div class="results-hidden" id="abResults">
        <div id="abResultsContent"></div>
      </div>
    </div>
  </div>

  <div class="lightbox" id="lightbox">
    <span class="lightbox-close" onclick="closeLightbox()">✕</span>
    <img id="lightboxImg" src="" alt="">
    <div class="lightbox-nav">
      <button class="lightbox-arrow" id="lightboxPrev" onclick="lightboxNav(-1)">← Vorige</button>
      <div class="lightbox-label" id="lightboxLabel"></div>
      <button class="lightbox-arrow" id="lightboxNext" onclick="lightboxNav(1)">Volgende →</button>
    </div>
  </div>

  <script>
    let _lbScreenshots = [];
    let _lbIndex = 0;

    function openLightbox(b64, step, total) {
      _lbIndex = step - 1;
      _updateLightbox();
      document.getElementById('lightbox').classList.add('active');
    }

    function _updateLightbox() {
      const total = _lbScreenshots.length;
      document.getElementById('lightboxImg').src = 'data:image/jpeg;base64,' + _lbScreenshots[_lbIndex];
      document.getElementById('lightboxLabel').textContent = `Stap ${_lbIndex + 1} van ${total}`;
      document.getElementById('lightboxPrev').disabled = _lbIndex === 0;
      document.getElementById('lightboxNext').disabled = _lbIndex === total - 1;
    }

    function lightboxNav(dir) {
      _lbIndex = Math.max(0, Math.min(_lbScreenshots.length - 1, _lbIndex + dir));
      _updateLightbox();
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
    }

    document.addEventListener('keydown', e => {
      if (!document.getElementById('lightbox').classList.contains('active')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') lightboxNav(-1);
      if (e.key === 'ArrowRight') lightboxNav(1);
    });

    // Tab switching
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
      });
    });

    const spinnerMessages = [
      'Agent navigeert...', 'Pagina aan het laden...', 'Elementen zoeken...',
      'Interactie uitvoeren...', 'Bijna klaar...',
    ];

    function startSpinner(textEl) {
      let i = 0;
      textEl.textContent = spinnerMessages[0];
      return setInterval(() => {
        i = (i + 1) % spinnerMessages.length;
        textEl.textContent = spinnerMessages[i];
      }, 3000);
    }

    function renderScreenshots(screenshots) {
      if (!screenshots || screenshots.length === 0) return '';
      _lbScreenshots = screenshots;
      const items = screenshots.map((b64, i) => `
        <div class="screenshot-item" onclick="openLightbox('${b64}', ${i + 1}, ${screenshots.length})">
          <img src="data:image/jpeg;base64,${b64}" alt="Stap ${i + 1}">
          <span class="screenshot-step">Stap ${i + 1}</span>
        </div>
      `).join('');
      return `
        <div class="screenshots-title">Bezochte pagina's</div>
        <div class="screenshots-strip">${items}</div>
      `;
    }

    function renderSingleResult(data) {
      const frictionHtml = data.friction_points && data.friction_points.length > 0
        ? `<ul class="friction-list">${data.friction_points.map(f => `<li>${f}</li>`).join('')}</ul>`
        : `<p class="no-friction">Geen friction points gevonden</p>`;

      return `
        <div class="result-header">
          <span class="badge ${data.success ? 'success' : 'fail'}">
            ${data.success ? '✓ Doel bereikt' : '✗ Mislukt'}
          </span>
        </div>
        <div class="meta">
          <div class="meta-item">
            <span class="meta-label">Stappen</span>
            <span class="meta-value">${data.steps}</span>
          </div>
          <div class="meta-item">
            <span class="meta-label">Tijd</span>
            <span class="meta-value">${data.time_seconds}s</span>
          </div>
        </div>
        <div class="reason">${data.reason}</div>
        <div class="friction-title">Friction points</div>
        ${frictionHtml}
        ${renderScreenshots(data.step_screenshots)}
      `;
    }

    // Single test
    document.getElementById('singleForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('singleBtn');
      const spinner = document.getElementById('singleSpinner');
      const results = document.getElementById('singleResults');
      const content = document.getElementById('singleResultsContent');

      btn.disabled = true;
      spinner.classList.add('active');
      results.classList.add('results-hidden');
      const interval = startSpinner(document.getElementById('singleSpinnerText'));

      try {
        const res = await fetch('/test', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            url: document.getElementById('url').value.trim(),
            goal: document.getElementById('goal').value.trim(),
            persona: document.getElementById('persona').value.trim() || 'casual shopper',
          }),
        });
        const data = await res.json();
        content.innerHTML = res.ok
          ? renderSingleResult(data)
          : `<div class="error-msg">Fout: ${data.detail || 'Onbekende fout'}</div>`;
      } catch (err) {
        content.innerHTML = `<div class="error-msg">Fout: ${err.message}</div>`;
      } finally {
        clearInterval(interval);
        spinner.classList.remove('active');
        btn.disabled = false;
        results.classList.remove('results-hidden');
      }
    });

    // AB test
    document.getElementById('abForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('abBtn');
      const spinner = document.getElementById('abSpinner');
      const results = document.getElementById('abResults');
      const content = document.getElementById('abResultsContent');

      btn.disabled = true;
      spinner.classList.add('active');
      results.classList.add('results-hidden');
      const interval = startSpinner(document.getElementById('abSpinnerText'));

      try {
        const res = await fetch('/ab-test', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            url_a: document.getElementById('url_a').value.trim(),
            url_b: document.getElementById('url_b').value.trim(),
            goal: document.getElementById('ab_goal').value.trim(),
            persona: document.getElementById('ab_persona').value.trim() || 'casual shopper',
          }),
        });
        const data = await res.json();

        if (!res.ok) {
          content.innerHTML = `<div class="card"><div class="error-msg">Fout: ${data.detail || 'Onbekende fout'}</div></div>`;
        } else {
          const winnerText = data.winner
            ? `Versie ${data.winner} wint — minder stappen, makkelijker doel bereikt`
            : 'Geen winnaar — beide versies gelijk of beide mislukt';

          content.innerHTML = `
            <div class="winner-banner">🏆 ${winnerText}</div>
            <div class="ab-results-grid">
              <div class="ab-result-card ${data.winner === 'A' ? 'is-winner' : ''}">
                <div class="ab-version-label">Versie A ${data.winner === 'A' ? '🏆' : ''}</div>
                ${renderSingleResult(data.version_a)}
              </div>
              <div class="ab-result-card ${data.winner === 'B' ? 'is-winner' : ''}">
                <div class="ab-version-label">Versie B ${data.winner === 'B' ? '🏆' : ''}</div>
                ${renderSingleResult(data.version_b)}
              </div>
            </div>
          `;
        }
      } catch (err) {
        content.innerHTML = `<div class="card"><div class="error-msg">Fout: ${err.message}</div></div>`;
      } finally {
        clearInterval(interval);
        spinner.classList.remove('active');
        btn.disabled = false;
        results.classList.remove('results-hidden');
      }
    });
  </script>
</body>
</html>
